            and a.get('emptied_at') else pending_prev) %}
      {%- set cap = (b | sum / b | count) if b else initial_kwh | float %}
      {{ (cap | round(3)) if cap > 0 else none }}
    buckets: >-
      {%- set a = this.attributes %}
      {%- set power_w = power_w | float(0) %}
      {%- set reading = reading | float(none) %}
      {%- set was_full = a.get('full') in [true, 'true', 'True'] %}
