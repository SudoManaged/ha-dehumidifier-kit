      {%- set low_since = none if reset else (low_prev if unsure else ((low_prev or now().isoformat()) if low else none)) %}
      {%- set full = (was_full or stopped) and not reset %}
      {%- set acc0 = a.get('energy_kwh', 0) | float(0) %}
      {%- set last = a.get('last_counter') | float(none) %}
      {%- set ns = namespace(inc=0) %}
      {%- if reading is not none and last is not none %}
        {%- if reading >= last %}{% set ns.inc = reading - last %}
        {%- elif reading < last * 0.9 %}{% set ns.inc = reading %}{% endif %}
        {%- set at = a.get('last_counter_at') %}
        {%- if at and ns.inc > 4 * (as_timestamp(now()) - as_timestamp(at, 0)) / 3600 + 0.05 %}{% set ns.inc = 0 %}{% endif %}
      {%- endif %}
      {%- set acc = 0 if reset else acc0 + ns.inc %}
      {%- set pending_prev = a.get('pending_kwh') | float(none) %}
      {%- set nb = namespace(b=[] if forget else (a.get('buckets') or []), at=none if forget else a.get('learned_at')) %}
      {%- if was_full and reset and not emptied_event and pending_prev is not none %}
        {%- set nb.b = (nb.b + [pending_prev | round(3)])[-(learn | int):] %}{% set nb.at = now().isoformat() %}
      {%- elif emptied_event and not was_full and nb.at and nb.b
