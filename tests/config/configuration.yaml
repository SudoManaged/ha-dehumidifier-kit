# Test configuration used by .github/workflows/validate.yml: Home Assistant's configuration check must accept
# every blueprint in this repository. Placeholder entities only; no real devices.
homeassistant:
  name: Blueprint test
  time_zone: UTC
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
http:
logbook:
persistent_notification:
notify:
template:
  - use_blueprint:
      path: sudomanaged/dehumidifier_bucket.yaml
      input:
        plug_switch: switch.test_dehumidifier_plug
        power_sensor: sensor.test_dehumidifier_plug_power
        energy_sensor: sensor.test_dehumidifier_plug_energy
        bucket_name: test
    name: Test dehumidifier bucket
    unique_id: test_dehumidifier_bucket
automation: !include automations.yaml
script: !include scripts.yaml
